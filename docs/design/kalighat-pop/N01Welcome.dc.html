<style>
body{margin:0}
.w{background:#FBF7EF;padding:0}
.w .bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 24px;margin-top:16px}
.w .brandmark{display:block;margin-left:-1px}
.w .pro{font-size:15px;font-weight:700;color:#1A1410;text-decoration:none;display:flex;align-items:center;gap:6px;height:44px}
.w .hero{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding:0 24px}
.w .hero svg.arch{height:100%;max-height:372px;width:auto;overflow:visible}
.w .glow{position:absolute;left:50%;bottom:8%;width:420px;height:420px;margin-left:-210px;border-radius:50%;background:radial-gradient(circle,rgba(239,177,42,.20),rgba(239,177,42,0) 65%)}
.w .copy{padding:0 24px}
.w .h1{font-size:50px;line-height:.94;letter-spacing:-1.6px;font-stretch:112%}
.w .lede{margin-top:12px;font-size:17px}
.w .online{margin-top:16px;display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:#fff;box-shadow:0 1px 0 rgba(26,20,16,.06)}
.w .online .av{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#1A1410}
.w .online .av:first-child{margin-left:0}
.w .online .dot{width:9px;height:9px;border-radius:50%;background:#62A65A;box-shadow:0 0 0 0 rgba(98,166,90,.5);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(98,166,90,.55)}60%{box-shadow:0 0 0 7px rgba(98,166,90,0)}}
.w .online b{font-size:15px;color:#1A1410}
.w .actions{padding:18px 24px 26px;display:flex;flex-direction:column;gap:4px}
.w .btn.primary{height:58px;font-size:19px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(200,48,43,.28)}

/* the arch: drawn in, then its painted dots slowly travel like festival lights */
.arch .band{stroke-dasharray:1200;stroke-dashoffset:1200;animation:archDraw 1.1s cubic-bezier(.6,0,.2,1) .15s forwards}
.arch .shade{stroke-dasharray:1200;stroke-dashoffset:1200;animation:archDraw 1.1s cubic-bezier(.6,0,.2,1) .2s forwards}
@keyframes archDraw{to{stroke-dashoffset:0}}
.arch .dots{opacity:0;animation:fadeIn .5s ease 1.1s forwards,dotsRun 9s linear 1.1s infinite}
@keyframes dotsRun{to{stroke-dashoffset:-130}}
@keyframes fadeIn{to{opacity:1}}
.arch .inside{opacity:0;animation:fadeIn .6s ease .5s forwards}
.arch .finial{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:finialPop .5s cubic-bezier(.3,1.6,.5,1) 1.05s forwards}
@keyframes finialPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
/* the marigold toran sways in a breeze */
.arch .toran{transform-origin:170px 92px;opacity:0;animation:fadeIn .5s ease 1.2s forwards,sway 4.6s ease-in-out 1.2s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.arch .leaf{transform-box:fill-box;transform-origin:50% 0;animation:leaf 3.2s ease-in-out infinite}
.arch .leaf.l2{animation-delay:.6s}.arch .leaf.l3{animation-delay:1.2s}
@keyframes leaf{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
/* the a: steps into the doorway, bows a namaste, then breathes, blinks and looks around */
.arch .a-in{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:aIn .7s cubic-bezier(.3,1.5,.5,1) .7s forwards}
@keyframes aIn{0%{opacity:0;transform:translateY(40px) scale(.8,1.1)}60%{opacity:1;transform:translateY(-6px) scale(1.04,.96)}100%{opacity:1;transform:none}}
.arch .a-bow{transform-box:fill-box;transform-origin:50% 100%;animation:bow 7s ease-in-out 1.6s infinite}
@keyframes bow{0%,4%{transform:none}10%,16%{transform:rotate(9deg) translateY(3px) scale(1,.97)}24%{transform:none}55%{transform:scale(1.025)}100%{transform:none}}
.arch .eyes{transform-box:fill-box;transform-origin:center;animation:look 7s ease-in-out 1.6s infinite}
@keyframes look{0%,30%{transform:translateX(0)}38%,52%{transform:translateX(5px)}60%,70%{transform:translateX(-4px)}78%,100%{transform:translateX(0)}}
.arch .lids{transform-box:fill-box;transform-origin:center;animation:blink 4.4s 2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.arch .happy{opacity:0;animation:happyEyes 7s ease-in-out 1.6s infinite}
.arch .open{animation:openEyes 7s ease-in-out 1.6s infinite}
@keyframes happyEyes{0%,6%{opacity:0}9%,22%{opacity:1}26%,100%{opacity:0}}
@keyframes openEyes{0%,6%{opacity:1}9%,22%{opacity:0}26%,100%{opacity:1}}
.arch .shadow{transform-box:fill-box;transform-origin:center;opacity:0;animation:fadeIn .4s ease 1s forwards}
.arch .say2{transform-box:fill-box;transform-origin:20% 100%;opacity:0;animation:sayIn .4s cubic-bezier(.3,1.4,.5,1) 1.75s forwards,sayOut 7s ease-in-out 1.75s infinite}
@keyframes sayOut{0%,40%{opacity:1}46%,100%{opacity:0}}
@keyframes sayIn{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
@media (max-height:700px){.w .h1{font-size:40px}.w .lede{font-size:16px}.arch .say2{display:none}}
@media (prefers-reduced-motion: reduce){.w *,.arch *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}.arch .happy{opacity:0!important}}
