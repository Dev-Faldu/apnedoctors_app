<style>
body{margin:0}
.gs{padding:20px 24px 28px}
.gs .toran{position:absolute;left:0;top:0;width:100%;height:56px;pointer-events:none;overflow:visible}
.gs .toran .sw{transform-origin:50% 0;animation:gsSway 5.2s ease-in-out infinite}
@keyframes gsSway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.gs .leaf{transform-box:fill-box;transform-origin:50% 0;animation:gsLeaf 3.4s ease-in-out infinite}
.gs .leaf.l2{animation-delay:.7s}
@keyframes gsLeaf{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.gs .top{margin-top:22px;position:relative;z-index:1}
.gs .back{margin-left:-10px}
.gs .heroRow{margin-top:46px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.gs .h1{font-size:46px;line-height:.94;letter-spacing:-1.4px;font-stretch:112%}
.gs .amark{width:100px;height:88px;flex:none;overflow:visible;margin:0 -6px 4px 0}
.gs .lede{margin-top:14px}
.gs .lab{display:block;margin:30px 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.gs .phone{height:62px;box-sizing:border-box;border-radius:18px;border:1.5px solid #D9CDBA;background:#fff;display:flex;align-items:center;padding:0 16px 0 18px;gap:12px}
.gs .phone.focus{border:2px solid var(--ink);box-shadow:0 0 0 4px rgba(200,48,43,.12)}
.gs .phone.ok{border:2px solid var(--ink)}
.gs .phone.bad{border:2px solid var(--red);box-shadow:0 0 0 4px rgba(200,48,43,.12);animation:gsNudge .42s ease-in-out 1}
@keyframes gsNudge{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.gs .phone.locked{background:#F4EEE4;border-color:#E3D9C9}
.gs .cc{font-size:20px;font-weight:700;color:var(--ink);font-stretch:105%}
.gs .sep{width:1.5px;height:28px;background:#E8DFD1;flex:none}
.gs .num{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:'Anek Latin',sans-serif;font-size:22px;font-weight:600;letter-spacing:.6px;color:var(--ink);padding:0;height:58px}
.gs .num::placeholder{color:#9A8D7C}
.gs .phone.locked .num{color:var(--muted)}
.gs .typed{display:flex;align-items:center;flex:1;min-width:0}
.gs .typed .num{flex:none;width:auto}
.gs .caret{width:2px;height:26px;border-radius:1px;background:var(--red);flex:none;animation:gsCaret 1.05s steps(1) infinite}
@keyframes gsCaret{50%{opacity:0}}
.gs .tick{flex:none}
.gs .help{min-height:20px;margin:8px 0 0;font-size:14px;line-height:1.4;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.gs .help.bad{color:#A3221D;font-weight:600}
.gs .help svg{flex:none;margin-top:1px}
.gs .send{margin-top:14px}
.gs .btn.off{cursor:default}
.gs .btn.done{background:var(--ink);color:var(--paper)}
.gs .sdots{display:inline-flex;gap:5px;margin-right:4px}
.gs .sdots span{width:7px;height:7px;border-radius:50%;background:#fff;animation:kDot 1.1s ease-in-out infinite}
.gs .sdots span:nth-child(2){animation-delay:.18s}.gs .sdots span:nth-child(3){animation-delay:.36s}
.gs .or{display:flex;align-items:center;gap:14px;margin:18px 0;font-size:14px;font-weight:700;color:var(--muted)}
.gs .or::before,.gs .or::after{content:"";flex:1;height:1.5px;background:#E8DFD1}
.gs .btn.google{background:#fff;color:var(--ink);border:1.5px solid #D9CDBA;font-weight:700;font-stretch:100%;font-size:17px;gap:12px}
.gs .btn.google.off{background:#F4EEE4;color:var(--muted);border-color:#E3D9C9}
.gs .btn.google.off svg{opacity:.45;filter:grayscale(1)}
.gs .grow{flex:1 1 auto;min-height:16px}
.gs .terms{margin:0;text-align:center;font-size:14px;line-height:1.45;color:var(--muted)}
.gs .terms a{color:var(--ink);font-weight:700}
.gs .signin{margin-top:6px;font-weight:600;font-size:16px}
.gs .signin b{color:var(--red);font-weight:800}
.gs .offline{margin-top:14px;display:flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:10px 16px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;line-height:1.3}
/* the living a */
.gs .aglide{transform-box:fill-box;transform-origin:50% 100%;animation:gsGlide .85s cubic-bezier(.3,1.15,.4,1) .05s both}
@keyframes gsGlide{0%{transform:translate(-118px,300px) scale(1.55);opacity:.0}12%{opacity:1}70%{transform:translate(4px,-6px) scale(.98)}100%{transform:none;opacity:1}}
.gs .abreath{transform-box:fill-box;transform-origin:50% 100%;animation:gsBreath 4.2s ease-in-out 1s infinite}
@keyframes gsBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035,.975)}}
.gs .alean{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-7deg)}
.gs .alean.lookup{transform:rotate(4deg)}
.gs .ablink{transform-box:fill-box;transform-origin:center;animation:kBlink 4.6s 1.4s infinite}
.gs .atremble{animation:kTremble .18s linear infinite}
.gs .ahop{transform-box:fill-box;transform-origin:50% 100%;animation:gsHop .7s cubic-bezier(.3,1.5,.5,1) 1}
@keyframes gsHop{0%{transform:none}40%{transform:translateY(-10px) scale(.96,1.05)}70%{transform:scale(1.05,.95)}100%{transform:none}}
.gs .eyes{transition:transform .18s ease-out}
.gs .hide{display:none}
/* number pad (system keyboard, shown only to place the layout) */
.gs .kb{position:absolute;left:0;right:0;bottom:0;height:291px;box-sizing:border-box;padding:8px 6px 0;background:#D1D4DA;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;animation:kSheet .35s cubic-bezier(.2,1,.3,1) both}
.gs .kbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px 6px}
.gs .key{height:47px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #898B8F;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000}
.gs .key b{font-size:25px;font-weight:400;line-height:1}
.gs .key i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:2px;margin-top:1px}
.gs .key.blank{background:transparent;box-shadow:none}
.gs .home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1A1410}
.gs.small{padding:18px 22px 24px}
.gs.compact .kb{height:258px}
.gs.compact .key{height:41px}
.gs.compact .h1{font-size:36px;letter-spacing:-1px}
.gs.compact .heroRow{margin-top:18px}
.gs.compact .lab{margin-top:12px}
.gs.compact .send{margin-top:10px}
.gs.compact .top{margin-top:24px}
@media (prefers-reduced-motion: reduce){.gs *{animation:none!important;transition:none!important}}
</style>
