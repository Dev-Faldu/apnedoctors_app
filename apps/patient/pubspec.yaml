name: apnedoctors
description: "ApneDoctors patient app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/fonts/OFL-AnekLatin.txt
    - assets/fonts/OFL-KaushanScript.txt
  fonts:
    # Anek Latin, variable (wght 100-800, wdth 75-125). Latin and Latin Extended subsets of the
    # same file Google Fonts serves; every style sets its axes explicitly (see core/theme/tokens.dart).
    - family: AnekLatin
      fonts:
        - asset: assets/fonts/AnekLatin-Variable.ttf
    - family: AnekLatinExt
      fonts:
        - asset: assets/fonts/AnekLatinExt-Variable.ttf
    # Kaushan Script: the wordmark only. The app draws its outlines (tool/gen_opening_spec.py);
    # the file is bundled for that generator and for any future wordmark text.
    - family: KaushanScript
      fonts:
        - asset: assets/fonts/KaushanScript-Regular.ttf

# Native splash: paper with the living "a" at scale 1, bounds centred on the screen. The app's first
# frame starts from exactly this pose (features/opening/opening_choreography.dart).
flutter_native_splash:
  color: "#FBF7EF"
  image: assets/brand/splash_a.png
  color_dark: "#FBF7EF"
  image_dark: assets/brand/splash_a.png
  android_12:
    color: "#FBF7EF"
    image: assets/brand/splash_a_android12.png
    color_dark: "#FBF7EF"
    image_dark: assets/brand/splash_a_android12.png
  fullscreen: false
  web: false

# App icon: the vermilion "a" with ink eyes on paper (same art as the legacy app's store icon).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF7EF"
  adaptive_icon_foreground: "assets/brand/android-icon-foreground.png"
  adaptive_icon_monochrome: "assets/brand/android-icon-monochrome.png"
  min_sdk_android: 24
